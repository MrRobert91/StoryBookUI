version: '3'
services:
  api:
    build: ./api
    ports:
      - '8000:8000'
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=${REDIS_URL}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2-2026-04-21}
      - PYTHONPATH=/app

  worker:
    build:
      context: .
      dockerfile: api/celery_tasks/Dockerfile.worker
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=${REDIS_URL}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2-2026-04-21}
      - PYTHONPATH=/app
